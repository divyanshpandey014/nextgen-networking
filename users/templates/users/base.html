{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ConnectGen — {% block title %}{% endblock %}</title>

  <!-- Embedded styling — no external CSS file required -->
  <style>
    :root{
      --bg: #0b0f14;
      --card-bg: #07101a;
      --accent: #0b72b9;
      --accent2: #1f7bdc;
      --muted: #9aa7b2;
      --text: #e6eef6;
    }
    /* Base resets */
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.45;
    }

    /* Top header */
    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:14px 20px;
      border-bottom:1px solid rgba(255,255,255,0.02);
      background: linear-gradient(180deg, rgba(0,0,0,0.22), transparent);
      position:sticky; top:0; z-index:20;
    }
    .brand{font-weight:800;color:var(--accent);font-size:1.35rem}
    .navlinks a{color:var(--muted);text-decoration:none;margin-left:12px;font-weight:700}
    .navlinks a:hover{color:var(--text)}

    /* Container & layout */
    .container{max-width:1100px;margin:18px auto;padding:0 16px}
    .card{background:var(--card-bg);border-radius:12px;padding:14px;border:1px solid rgba(255,255,255,0.02);box-shadow:0 8px 28px rgba(0,0,0,0.55)}
    .btn{display:inline-block;background:var(--accent);color:#04101a;padding:8px 12px;border-radius:10px;text-decoration:none;font-weight:700;border:none;cursor:pointer}
    .btn.secondary{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)}
    .muted{color:var(--muted)}
    .profile-photo{width:90px;height:90px;border-radius:10px;object-fit:cover;border:1px solid rgba(255,255,255,0.03)}
    input, select, textarea{
      background:#04101a;border:1px solid rgba(255,255,255,0.06);color:var(--text);padding:10px;border-radius:8px;width:100%;outline:none
    }
    textarea{min-height:120px;resize:vertical}
    .search-input{padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:#04101a;color:var(--text)}

    /* small helpers */
    .flex{display:flex;gap:12px;align-items:center}
    .grid-2{display:grid;grid-template-columns:320px 1fr;gap:18px}
    @media (max-width:900px){ .grid-2{grid-template-columns:1fr} .header{padding:12px} }

    footer{padding:18px;text-align:center;color:var(--muted);font-size:.9rem;margin-top:28px;border-top:1px solid rgba(255,255,255,0.02)}
  </style>
</head>

<body>
  <!-- Header -->
  <header class="header">
    <div class="flex">
      <div class="brand">ConnectGen</div>
      <div style="margin-left:12px;color:var(--muted);font-weight:700;">— DOON UNIVERSITY</div>
    </div>

    <nav class="navlinks">
      <a href="{% url 'users:home' %}">Home</a>
      <a href="{% url 'users:directory' %}">Directory</a>
      <a href="{% url 'users:inbox' %}">Inbox</a>
      {% if user.is_authenticated %}
        <a href="{% url 'users:dashboard' %}">Dashboard</a>
        <a href="{% url 'users:logout' %}">Logout</a>
      {% else %}
        <a href="{% url 'users:login' %}">Sign in</a>
        <a href="{% url 'users:signup' %}">Register</a>
      {% endif %}
      <a href="{% url 'users:contact' %}">Contact</a>
    </nav>
  </header>

  <!-- Content block -->
  <main>
    {% block content %}
    <!-- default content can go here -->
    {% endblock %}
  </main>

  <footer>
    © ConnectGen — DOON UNIVERSITY
  </footer>
</body>
</html>
